[pytest]
DJANGO_SETTINGS_MODULE = backend.settings_test
pythonpath = backend
testpaths = tests
asyncio_mode = auto
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
markers =
    slow: marks tests as slow
    e2e: marks tests as end-to-end (Playwright browser tests)
    auth: authentication and password management tests
    user_mgmt: user management tests
    inventory: inventory module tests
    stock_register: stock register module tests
    stock_request: stock request workflow tests
    damaged_entry: damaged entry module tests
    service_entry: service entry module tests
    audit: audit log tests
    cross_module: cross-module integration tests
    nonfunctional: non-functional tests (session, refresh, network)
    critical: critical severity tests
    high: high severity tests
    medium: medium severity tests
    low: low severity tests
